{% extends "przychodnia/base.html" %}

{% block title %}Logowanie{% endblock %}

{% block content %}
<h2>Logowanie:</h2>
{% if error %}
    <p style="color:red;">{{ error }}</p>
{% endif %}
<form method="post">
    {% csrf_token %}
    <p>Login: <input type="text" name="username"></p>
    <p>Hasło: <input type="password" name="password"></p>
    <p><input type="submit" value="Zaloguj"></p>
</form>
<p>Nie masz jeszcze konta? <a href="{% url 'user-register-step1' %}">Zarejestruj się</a></p>
{% endblock %}
