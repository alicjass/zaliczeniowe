{% extends "przychodnia/base.html" %}

{% block title %}Edycja profilu{% endblock %}

{% block content %}
<h2>Edytuj profil:</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background-color: #4CAF50; color: white; padding: 6px 12px;">
        Zapisz zmiany
    </button>
    <a href="{% url 'user-profil' %}" style="margin-left: 10px;">Anuluj</a>
</form>

{% endblock %}
