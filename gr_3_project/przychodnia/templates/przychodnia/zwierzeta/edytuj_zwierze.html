{% extends "przychodnia/base.html" %}

{% block title %}Edytuj zwierzę{% endblock %}

{% block content %}
<h2>Edytuj zwierzaka:</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background-color: green; color: white; padding: 6px 12px;">
        Zapisz zmiany
    </button>
    <a href="{% url 'zwierze-detail' pk=zwierze.pk %}" style="margin-left: 10px;">
        Anuluj
    </a>
</form>
<hr>
{% endblock %}
