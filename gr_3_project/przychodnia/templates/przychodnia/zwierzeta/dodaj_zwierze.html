{% extends "przychodnia\base.html" %}

{% block title %}Dodaj zwierzaka{% endblock %}

{% block content %}
<h1>Dodaj zwierzaka:</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background-color: green; color: white; padding: 6px 12px;">
        Zapisz</button>
    <a href="{% url 'lista-zwierzat' %}" style="margin-left: 10px;">
        Anuluj
    </a>
</form>
<hr>
{% endblock %}
