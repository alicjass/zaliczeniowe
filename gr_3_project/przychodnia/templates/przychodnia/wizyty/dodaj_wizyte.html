{% extends "przychodnia/base.html" %}

{% block title %}Dodaj wizytę{% endblock %}

{% block content %}
<h2>Dodaj wizytę:</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" style="background-color: green; color: white; padding: 6px 12px;">
        Zapisz</button>
    <a href="{% url 'przyszle-wizyty' %}" style="margin-left: 10px;">
        Anuluj
    </a>
</form>
<hr>
{% endblock %}
